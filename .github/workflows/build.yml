name: Build APK

# Jalan otomatis tiap kali ada push ke folder ini, dan bisa dipicu manual
# lewat tombol "Run workflow" di tab Actions.
on:
  push:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang paket Android SDK yang dibutuhkan
        # Runner GitHub sudah punya Android SDK bawaan (ANDROID_HOME).
        # Jangan bikin SDK baru di path lain, cukup lengkapi paketnya di situ.
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (debug, langsung bisa dipasang di HP)
        run: gradle assembleDebug --stacktrace

      - name: Unggah hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiMaling-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
